schemaVersion: 2.1.0
metadata:
  generateName: devfile-quarkus-api-demo
attributes:
  controller.devfile.io/storage-type: ephemeral
components:
  - name: quarkus-api-demo
    container:
      image: quay-registry-quay-quay-enterprise.apps.gcp-op-desa.cloud.mh.gob.sv/devspaces/java21-base:1.0.0
      env:
        - name: QUARKUS_HTTP_HOST
          value: 0.0.0.0
      endpoints:
        - exposure: none
          name: debug
          protocol: tcp
          targetPort: 5005 
        - exposure: public
          name: list-all-food
          protocol: http
          targetPort: 8080
          path: /food      
    mountSources: true
  - name: postgresql
    container:
      image: 'quay.io/centos7/postgresql-13-centos7@sha256:994f5c622e2913bda1c4a7fa3b0c7e7f75e7caa3ac66ff1ed70ccfe65c40dd75'
      memoryLimit: 256Mi
      memoryRequest: 128Mi
      cpuLimit: 100m
      cpuRequest: 50m
      mountSources: true
      env:
        - name: POSTGRESQL_USER
          value: user
        - name: POSTGRESQL_PASSWORD 
          value: password
        - name: POSTGRESQL_DATABASE
          value: food_db
        - name: PGDATA
          value: /tmp/pgdata
